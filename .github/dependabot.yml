version: 2

updates:
  # The actions used by the workflows, bundled into one pull request a month.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # Python dev tools only (pytest, ruff, mypy, mkdocs-material).
  #
  # The ML packages in requirements.txt are deliberately frozen, because they are
  # the versions behind the committed benchmark results. They are upgraded by
  # hand, together with a fresh benchmark run, so Dependabot does not propose them.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    allow:
      - dependency-name: "pytest"
      - dependency-name: "pytest-cov"
      - dependency-name: "ruff"
      - dependency-name: "mypy"
      - dependency-name: "mkdocs-material"
    groups:
      dev-tools:
        patterns: ["*"]
    commit-message:
      prefix: deps

  # The python base image of docker/Dockerfile and docker/Dockerfile.arm64.
  # Only patch releases are proposed, so the images stay on Python 3.11, the
  # version the committed results were produced with.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: docker
