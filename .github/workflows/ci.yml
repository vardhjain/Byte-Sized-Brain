name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint + unit tests (x86)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (core + dev only — no heavy frameworks)
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Mypy (light)
        run: mypy src
        continue-on-error: true
      - name: Unit tests
        run: pytest -m "not smoke" -q

  smoke-tensorflow:
    name: Smoke pipelines (TensorFlow, x86)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install with TensorFlow extra
        run: pip install -e ".[tf,dev]"
      - name: End-to-end smoke (TFLite pipelines)
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"
          TF_ENABLE_ONEDNN_OPTS: "0"
        # distilbert smoke auto-skips here (torch not installed).
        run: pytest -m smoke -q

  arm64-smoke:
    name: ARM64 emulation smoke (QEMU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Unit tests on emulated aarch64
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD":/app -w /app \
            python:3.11-slim bash -c "
              pip install -q -e '.[dev]' &&
              python -c 'import platform; print(\"arch:\", platform.machine())' &&
              bsb info &&
              pytest -m 'not smoke' -q"
