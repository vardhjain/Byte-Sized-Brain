name: CI

on:
  push:
    branches: ["Byte-Sized-Brain"]
  pull_request:
  workflow_dispatch:

# Every job only needs to read the repository.
permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

# Every install passes `-c requirements.txt`, so CI gets the exact versions that
# produced the committed results (and the same ruff and mypy as a local
# `make check`) while installing only the extras each job needs.

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install the package and the dev tools
        run: pip install -c requirements.txt -e ".[dev]"
      # Linting "." covers src, tests, demo and scripts. Ruff skips gitignored paths.
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        run: mypy

  unit-tests:
    name: Unit tests (${{ matrix.arch }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        arch: [x86_64, arm64]
        include:
          - arch: x86_64
            runner: ubuntu-latest
          # GitHub's native ARM64 runner, so no QEMU emulation is needed here.
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install the package and the dev tools (no ML frameworks)
        run: pip install -c requirements.txt -e ".[dev]"
      - name: Show the environment
        run: bsb info
      - name: Fast tests
        run: pytest -m "not smoke"

  tflite-smoke:
    name: TFLite smoke (${{ matrix.arch }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      TF_CPP_MIN_LOG_LEVEL: "2"
      TF_ENABLE_ONEDNN_OPTS: "0"
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        arch: [x86_64, arm64]
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install the package with TensorFlow
        run: pip install -c requirements.txt -e ".[tf,dev]"
      # Converts a tiny in-memory model to FP32, static INT8 and dynamic-range
      # TFLite and runs each through the harness. No downloads, no training.
      - name: Conversion round trip
        run: pytest -m tf
      # Real train, convert and benchmark for the two lightest pipelines. This
      # downloads MNIST and IMDB. CIFAR-10 and DistilBERT stay in `make smoke`.
      - name: Pipeline smoke (FFN/MNIST and RNN/IMDB)
        run: pytest -m smoke -k "ffn_mnist or rnn_imdb"
