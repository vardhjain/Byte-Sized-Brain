name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint + unit tests (x86)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (core + dev only — no heavy frameworks)
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Mypy (light)
        run: mypy src
        continue-on-error: true
      - name: Unit tests
        run: pytest -m "not smoke" -q

  smoke-tensorflow:
    name: TFLite conversion smoke (TensorFlow, x86)
    runs-on: ubuntu-latest
    env:
      TF_CPP_MIN_LOG_LEVEL: "2"
      TF_ENABLE_ONEDNN_OPTS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install with TensorFlow extra
        run: pip install -e ".[tf,dev]"
      # Gate: deterministic, network-free convert -> run roundtrip (fast, reliable).
      - name: Conversion smoke (gate)
        run: pytest -m tf -q
      # Non-blocking: full real-data train->convert->benchmark. Surfaces its own
      # traceback as a CI annotation if it fails, without failing the build (the
      # full suite downloads datasets + trains, so it lives in `make smoke` locally).
      - name: Full real-data pipeline smoke (diagnostic, non-blocking)
        continue-on-error: true
        run: |
          set +e
          pytest -m smoke -rA --tb=short > smoke.log 2>&1
          code=$?
          tail -n 80 smoke.log
          if [ "$code" -ne 0 ]; then
            msg=$(tail -n 50 smoke.log | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=real-smoke-diagnostic::${msg}"
          fi
          exit 0

  arm64-smoke:
    name: ARM64 emulation smoke (QEMU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Unit tests on emulated aarch64
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD":/app -w /app \
            python:3.11-slim bash -c "
              pip install -q -e '.[dev]' &&
              python -c 'import platform; print(\"arch:\", platform.machine())' &&
              bsb info &&
              pytest -m 'not smoke' -q"
