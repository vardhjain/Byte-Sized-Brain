site_name: Byte-Sized Brain
site_description: Post-training quantization trade-offs, measured honestly across four model families.
site_url: https://vardhjain.github.io/Byte-Sized-Brain/
repo_url: https://github.com/vardhjain/Byte-Sized-Brain
repo_name: vardhjain/Byte-Sized-Brain
copyright: MIT licensed, Vardh Jain

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md
  - Methodology: methodology.md
  - Results: report.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.superfences
