[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "byte-sized-brain"
version = "0.1.0"
description = "Benchmarking the accuracy / size / latency / memory trade-offs of post-training quantization across four model families and three modalities, on x86 and ARM64."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vardh Jain", email = "vardhjain20@gmail.com" }]
keywords = [
    "quantization", "edge-ml", "tflite", "onnx", "model-compression",
    "benchmarking", "tensorflow", "pytorch", "arm64",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core dependencies — enough to load configs, run the benchmark harness,
# aggregate results and render charts. Heavy ML frameworks are optional extras
# so a contributor can install only the pipelines they care about.
dependencies = [
    "numpy>=1.24,<2.0",
    "pyyaml>=6.0",
    "pydantic>=2.0,<3.0",
    "psutil>=5.9",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# TensorFlow pipelines: FFN/MNIST, CNN/CIFAR-10, RNN/IMDB (TFLite).
tf = ["tensorflow>=2.16,<2.22"]
# PyTorch / HuggingFace pipeline: DistilBERT/IMDB (ONNX Runtime).
torch = [
    "torch>=2.2",
    "transformers>=4.45",
    "datasets>=2.16",
    "onnxruntime>=1.16",
    "onnx>=1.15",
    "accelerate>=0.26",
]
all = [
    "tensorflow>=2.16,<2.22",
    "torch>=2.2",
    "transformers>=4.45",
    "datasets>=2.16",
    "onnxruntime>=1.16",
    "onnx>=1.15",
    "accelerate>=0.26",
]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.8"]

[project.scripts]
bsb = "byte_sized_brain.cli:main"

[project.urls]
Homepage = "https://github.com/vardhjain/Byte-Sized-Brain"
Repository = "https://github.com/vardhjain/Byte-Sized-Brain"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
byte_sized_brain = ["py.typed"]

# ─────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
# E402: pipeline modules intentionally import heavy frameworks lazily, inside
# functions, so the CLI stays fast — that is by design, not a smell.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

# ─────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "smoke: end-to-end train→convert→benchmark on a tiny subset (slow, needs frameworks)",
    "tf: requires TensorFlow",
    "torch: requires PyTorch + transformers",
]

# ─────────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true   # tensorflow / torch / onnxruntime ship no stubs
warn_unused_ignores = false
no_implicit_optional = true
files = ["src"]
